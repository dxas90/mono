# -------------------------------------------------
# TROUBLESHOOTING
# -------------------------------------------------

# Problem: Test report not showing in GitLab MR
# Solution:
#   1. Ensure enable_test_report: "true"
#   2. Verify test_report_path points to valid JUnit XML
#   3. Check artifacts section includes the report file
#   4. Confirm test command generates JUnit XML

# Problem: Coverage not showing in GitLab MR diff
# Solution:
#   1. Ensure enable_coverage: "true"
#   2. Verify coverage_path points to valid Cobertura/Jacoco XML
#   3. Check coverage_format matches actual format
#   4. Ensure coverage report includes file paths relative to repo root

# Problem: "No coverage report found" error
# Solution:
#   1. Run test command locally to verify it generates coverage.xml
#   2. Check that coverage path is correct and accessible
#   3. Ensure coverage format is supported (cobertura, jacoco)
#   4. Verify coverage XML is valid (not empty, correct schema)

# Problem: Coverage shows 0% for all files
# Solution:
#   1. Ensure file paths in coverage report are relative to repo root
#   2. Check that source code is in the paths specified in coverage report
#   3. Verify coverage was actually collected during test run
#   4. Confirm coverage report is not filtered to exclude all files
