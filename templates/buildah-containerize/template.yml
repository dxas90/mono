spec:
  inputs:
    # Job configuration
    stage:
      default: containerize
      description: "Pipeline stage for the containerize job"
    job_name:
      default: "containerize"
      description: "Name of the containerization job"

    # Image configuration
    image_repository:
      default: "$CI_REGISTRY_IMAGE"
      description: "Container image repository (without tag)"
    image_tag:
      default: ""
      description: "Primary image tag (auto-computed if empty)"

    # Build configuration
    dockerfile_path:
      default: ""
      description: "Path to Dockerfile (auto-detected if not specified)"
    containerfile_path:
      default: ""
      description: "Path to Containerfile (alternative to Dockerfile)"
    build_context:
      default: "$CI_PROJECT_DIR"
      description: "Build context directory"
    build_args:
      default: ""
      description: "Space-separated build arguments (e.g., 'BASE_IMAGE=python:3.10 VERSION=1.0')"

    # Tagging options
    auto_tag_strategy:
      default: "auto"
      description: "Automatic tagging (auto: branch tags + latest on main; manual: only specified tags)"
      options:
        - "auto"
        - "manual"
    additional_tags:
      default: ""
      description: "Space-separated additional tags (e.g., 'stable v1')"

    # Registry configuration
    registry:
      default: "$CI_REGISTRY"
      description: "Container registry URL"
    registry_user:
      default: "$CI_REGISTRY_USER"
      description: "Registry username"
    registry_password:
      default: "$CI_REGISTRY_PASSWORD"
      description: "Registry password"
    tls_verify:
      default: "true"
      description: "Enable TLS verification (disable only in private networks)"

    # Buildah settings
    storage_driver:
      default: "vfs"
      description: "Storage driver (vfs=simple/slower, overlay=fast/needs-fuse)"
      options:
        - "vfs"
        - "overlay"
    buildah_format:
      default: "docker"
      description: "Image format (docker or oci)"
      options:
        - "docker"
        - "oci"
    buildah_isolation:
      default: "chroot"
      description: "Buildah isolation mode"
      options:
        - "chroot"
        - "rootless"
    buildah_args:
      default: ""
      description: "Additional arguments for buildah bud command"

    # Performance options
    enable_layer_cache:
      default: "true"
      description: "Enable layer caching (pulls previous image as cache)"
      options:
        - "true"
        - "false"
    parallel_push:
      default: "true"
      description: "Push tags in parallel (faster for multiple tags)"
      options:
        - "true"
        - "false"
    compression_level:
      default: "6"
      description: "Compression level for pushed images (0-9, higher=smaller/slower)"

    # Job dependencies
    needs:
      default: []
      description: "Job dependencies"
    no_push:
      default: ""
      description: "Skip pushing image to registry if set"
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: quay.io/buildah/stable:latest
  variables:
    STORAGE_DRIVER: $[[ inputs.storage_driver ]]
    BUILDAH_FORMAT: $[[ inputs.buildah_format ]]
    BUILDAH_ISOLATION: $[[ inputs.buildah_isolation ]]
    BUILDAH_ARGS: $[[ inputs.buildah_args ]]
    BUILDAH_LAYERS: "true"
    BUILD_CONTEXT: $[[ inputs.build_context ]]
    REGISTRY: $[[ inputs.registry ]]
    REGISTRY_USER: $[[ inputs.registry_user ]]
    REGISTRY_PASSWORD: $[[ inputs.registry_password ]]
    IMAGE_REPOSITORY: $[[ inputs.image_repository ]]
    IMAGE_TAG: $[[ inputs.image_tag ]]
    DOCKERFILE_PATH: $[[ inputs.dockerfile_path ]]
    CONTAINERFILE_PATH: $[[ inputs.containerfile_path ]]
    TLS_VERIFY: $[[ inputs.tls_verify ]]
    NO_PUSH: $[[ inputs.no_push ]]
    BUILD_ARGS: $[[ inputs.build_args ]]
    AUTO_TAG_STRATEGY: $[[ inputs.auto_tag_strategy ]]
    ADDITIONAL_TAGS: $[[ inputs.additional_tags ]]
    ENABLE_LAYER_CACHE: $[[ inputs.enable_layer_cache ]]
    PARALLEL_PUSH: $[[ inputs.parallel_push ]]
    COMPRESSION_LEVEL: $[[ inputs.compression_level ]]
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 30 mins
  before_script:
    - echo "=================================================="
    - echo "🏗️  Building Container Image with Buildah"
    - echo "=================================================="
    - touch build.env || true && source build.env
    # Fix DNS resolution
    - echo "nameserver 1.1.1.1" > /etc/resolv.conf
    # Install utilities
    - dnf install -y curl --setopt=install_weak_deps=False
    # Authenticate with registry
    - echo "🔐 Authenticating with Container Registry..."
    - echo "$REGISTRY_PASSWORD" | buildah login -u "$REGISTRY_USER" --password-stdin "$REGISTRY"
    - echo "✅ Registry Authentication successful!"
    - echo ""
  script:
    # Locate Dockerfile / Containerfile
    - |
      if [ -z "$DOCKERFILE_PATH" ]; then
        if [ -f "$BUILD_CONTEXT/Dockerfile" ]; then
          DOCKERFILE_PATH="$BUILD_CONTEXT/Dockerfile"
        elif [ -n "$CONTAINERFILE_PATH" ] && [ -f "$CONTAINERFILE_PATH" ]; then
          DOCKERFILE_PATH="$CONTAINERFILE_PATH"
        elif [ -f "$BUILD_CONTEXT/Containerfile" ]; then
          DOCKERFILE_PATH="$BUILD_CONTEXT/Containerfile"
        else
          echo "ERROR -> No Dockerfile or Containerfile found in build context"
          exit 1
        fi
      fi
      echo "📄 Using Dockerfile: $DOCKERFILE_PATH"
      echo ""

    # Prepare build arguments
    - |
      BUILD_ARG_FLAGS=""
      if [ -n "$BUILD_ARGS" ]; then
        echo "🔧 Build Arguments:"
        for arg in $BUILD_ARGS; do
          BUILD_ARG_FLAGS="$BUILD_ARG_FLAGS --build-arg ${arg}"
          echo "   └─ ${arg}"
        done
        echo ""
      fi

    # Determine VERSION tag using unified logic
    - |
      if [ -z "${IMAGE_TAG}" ]; then
        if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
          VERSION="latest"
        elif [ -n "$CI_COMMIT_TAG" ]; then
          NOSLASH=$(echo "$CI_COMMIT_TAG" | tr -s / -)
          SANITIZED="${NOSLASH//[^a-zA-Z0-9.-]/}"
          VERSION="$SANITIZED"
        else
          NOSLASH=$(echo "$CI_COMMIT_REF_NAME" | tr -s / -)
          SANITIZED="${NOSLASH//[^a-zA-Z0-9-]/}"
          VERSION="branch-$SANITIZED"
        fi
      else
        VERSION="$IMAGE_TAG"
      fi
      echo "🏷️  Primary Tag: ${VERSION}"
      echo "IMAGE_TAG=${IMAGE_REPOSITORY}:${VERSION}" >> build.env
      echo "VERSION=${VERSION}" >> build.env

    # Build tag list based on strategy
    - |
      TAGS_TO_PUSH="${VERSION}"
      TAG_FLAGS="--tag ${IMAGE_REPOSITORY}:${VERSION}"

      if [ "$AUTO_TAG_STRATEGY" = "auto" ]; then
        # Auto strategy: add 'latest' on default branch
        if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
          TAG_FLAGS="$TAG_FLAGS --tag ${IMAGE_REPOSITORY}:latest"
          TAGS_TO_PUSH="$TAGS_TO_PUSH latest"
          echo "   └─ latest (auto: default branch)"
        fi

        # Add commit SHA tag
        TAG_FLAGS="$TAG_FLAGS --tag ${IMAGE_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
        TAGS_TO_PUSH="$TAGS_TO_PUSH ${CI_COMMIT_SHORT_SHA}"
        echo "   └─ ${CI_COMMIT_SHORT_SHA} (auto: commit)"
      fi

      # Add additional tags
      if [ -n "$ADDITIONAL_TAGS" ]; then
        echo "   Additional tags:"
        for tag in $ADDITIONAL_TAGS; do
          TAG_FLAGS="$TAG_FLAGS --tag ${IMAGE_REPOSITORY}:${tag}"
          TAGS_TO_PUSH="$TAGS_TO_PUSH ${tag}"
          echo "      └─ ${tag}"
        done
      fi
      echo ""

    # Configure isolation
    - |
      if [ "$BUILDAH_ISOLATION" = "rootless" ]; then
        export BUILDAH_ISOLATION=rootless
        export STORAGE_DRIVER=vfs
        echo "🔒 Using rootless isolation with vfs storage"
        echo ""
      fi

    # Pull previous image for layer caching
    - |
      CACHE_FLAGS=""
      if [ "${ENABLE_LAYER_CACHE}" = "true" ]; then
        echo "⚡ Attempting to pull previous image for layer cache..."
        CACHE_TAG="latest"
        if buildah pull --storage-driver="${STORAGE_DRIVER}" "${IMAGE_REPOSITORY}:${CACHE_TAG}" 2>/dev/null; then
          echo "   ✓ Pulled cache from ${IMAGE_REPOSITORY}:${CACHE_TAG}"
          CACHE_FLAGS="--cache-from ${IMAGE_REPOSITORY}:${CACHE_TAG}"
        else
          echo "   ⚠ No previous image found, building from scratch"
        fi
        echo ""
      fi

    # Build image with OCI labels
    - |
      echo "🔨 Building image..."
      buildah bud \
        --storage-driver="$STORAGE_DRIVER" \
        --isolation="$BUILDAH_ISOLATION" \
        --format="$BUILDAH_FORMAT" \
        --layers \
        --tls-verify=$TLS_VERIFY \
        --file "$DOCKERFILE_PATH" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --label org.opencontainers.image.created="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
        --label org.opencontainers.image.title="$(basename $CI_PROJECT_NAME)" \
        --label io.gitlab.pipeline-id="$CI_PIPELINE_ID" \
        --label io.gitlab.commit-sha="$CI_COMMIT_SHA" \
        --label io.gitlab.commit-ref="$CI_COMMIT_REF_NAME" \
        $BUILD_ARG_FLAGS \
        $CACHE_FLAGS \
        $BUILDAH_ARGS \
        $TAG_FLAGS \
        "$BUILD_CONTEXT"
      echo "✅ Build successful!"
      echo ""

    # Push all tags to registry
    - |
      if [ -z "$NO_PUSH" ]; then
        echo "📤 Pushing images to registry..."

        if [ "${PARALLEL_PUSH}" = "true" ] && [ $(echo "$TAGS_TO_PUSH" | wc -w) -gt 1 ]; then
          echo "   Using parallel push for faster uploads"
          for tag in $TAGS_TO_PUSH; do
            echo "   Pushing ${IMAGE_REPOSITORY}:${tag}..."
            buildah push \
              --storage-driver="$STORAGE_DRIVER" \
              --compression-format=gzip \
              --compression-level=$COMPRESSION_LEVEL \
              "${IMAGE_REPOSITORY}:${tag}" &
          done
          wait  # Wait for all parallel pushes to complete
          echo ""
          echo "   ✓ Successfully pushed all tags:"
          for tag in $TAGS_TO_PUSH; do
            echo "      └─ ${IMAGE_REPOSITORY}:${tag}"
          done
        else
          for tag in $TAGS_TO_PUSH; do
            echo "   Pushing ${IMAGE_REPOSITORY}:${tag}..."
            buildah push \
              --storage-driver="$STORAGE_DRIVER" \
              --compression-format=gzip \
              --compression-level=$COMPRESSION_LEVEL \
              "${IMAGE_REPOSITORY}:${tag}"
            echo "      ✓ ${IMAGE_REPOSITORY}:${tag}"
          done
        fi
        echo ""
        echo "=================================================="
        echo "✅ Successfully published all images!"
        echo "=================================================="
      else
        echo "⚠️  Skipping push (NO_PUSH defined)"
      fi
  needs: $[[ inputs.needs ]]
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME =~ /^v\d+\.\d+\.\d+.*$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: on_success
