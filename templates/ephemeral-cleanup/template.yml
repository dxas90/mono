spec:
  inputs:
    stage:
      default: cleanup
      description: "Pipeline stage for the cleanup job"
    job_name:
      default: "cleanup-ephemeral"
      description: "Name of the cleanup job"
    kubectl_image:
      default: "bitnami/kubectl:latest"
      description: "kubectl container image"
    ephemeral_namespace:
      default: "$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG"
      description: "Namespace to clean up"
    needs:
      default: []
      description: "Job dependencies"
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.kubectl_image ]]
  variables:
    EPHEMERAL_NAMESPACE: $[[ inputs.ephemeral_namespace ]]
  script:
    - echo "🧹 Cleaning up ephemeral namespace: $EPHEMERAL_NAMESPACE"
    - kubectl delete namespace $EPHEMERAL_NAMESPACE || echo 'Namespace already removed'
  needs: $[[ inputs.needs ]]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
