---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dev
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./clusters/kind/dev/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: mono-learn
    namespace: flux-system
  postBuild:
    substitute:
      NAMESPACE: learn-dev
      ENV_SUFFIX: dev
      CLUSTER: kind-dev
      ENVIRONMENT: dev
      AWS_REGION: us-east-1
  patches:
    - # Add Sops decryption to all Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
