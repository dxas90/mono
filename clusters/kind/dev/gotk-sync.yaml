---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mono-learn-dev
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./clusters/kind/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: mono-learn
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dev
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: mono-learn
    namespace: flux-system
