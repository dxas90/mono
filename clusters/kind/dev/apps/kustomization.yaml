---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ../../../../overlays/dev/learn-go
  - ../../../../overlays/dev/learn-python
  - ../../../../overlays/dev/learn-rust
  - ../../../../overlays/dev/ui
  - ../../../../overlays/dev/mesh
  - https://raw.githubusercontent.com/dxas90/pangolin-gateway-controller/refs/tags/v0.2.0/config/deployment.yaml
  - https://raw.githubusercontent.com/dxas90/pangolin-gateway-controller/refs/tags/v0.2.0/config/rbac.yaml
  - https://raw.githubusercontent.com/dxas90/pangolin-gateway-controller/refs/tags/v0.2.0/config/gatewayclass.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "ghcr.io/dxas90/pangolin-gateway-controller:0.2.0"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "IfNotPresent"
    target:
      kind: Deployment
      name: pangolin-gateway-controller
