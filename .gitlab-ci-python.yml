include:
  - local: .gitlab-ci-common.yml

stages:
  - test
  - containerize
  - promote
  - deploy

.python-test:
  image: python:3.12
  stage: test
  before_script:
    - *load_env
  script:
    - echo "🐍 Installing dependencies..."
    - pip install --upgrade pip
    - pip install -r requirements.txt || true
    - pytest || echo "Tests failed but continuing..."

build_python_app:
  extends: .python-test

containerize_python_app:
  extends: .containerize
  needs: [build_python_app]

promote_python_image:
  extends: .image-promote
  needs: [containerize_python_app]

deploy_python_app:
  extends: .deploy
  needs: [promote_python_image]

