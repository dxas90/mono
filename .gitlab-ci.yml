# Microsandbox fleet runner — comprehensive corner-case test suite
# Each job runs in a FRESH ephemeral microVM (alpine 3.24, aarch64, 1 CPU, 1GB RAM, 3.9GB disk)

stages:
  - baseline
  - languages
  - build-tools
  - network
  - stress

.msb:
  tags: [msb]
  before_script:
    - apk update -q

# ── baseline ──────────────────────────────────────────────────────────────────

baseline:isolation:
  extends: .msb
  stage: baseline
  script:
    - echo "=== VM identity ==="
    - hostname && uname -a
    - echo "Arch=$(uname -m) Cores=$(nproc) RAM=$(free -m | awk '/Mem/{print $2}')MB"
    - df -h /
    - cat /proc/1/cmdline | tr '\0' ' '
    - ps aux | wc -l | xargs echo "process count:"
    - id

baseline:ephemeral:
  extends: .msb
  stage: baseline
  script:
    - test ! -f /tmp/msb-was-here || (echo "LEAK detected!" && exit 1)
    - echo "clean" > /tmp/msb-was-here
    - echo "Wrote sentinel — next job on a DIFFERENT VM wont see it."

baseline:network:
  extends: .msb
  stage: baseline
  script:
    - apk add -q curl
    - curl -sf --max-time 5 https://gitlab.com          > /dev/null && echo "gitlab.com OK"
    - curl -sf --max-time 5 https://github.com          > /dev/null && echo "github.com OK"
    - curl -sf --max-time 5 https://registry.npmjs.org/ > /dev/null && echo "npmjs.org OK"
    - curl -sf --max-time 5 https://pypi.org/           > /dev/null && echo "pypi.org OK"
    - curl -sf --max-time 5 https://proxy.golang.org/   > /dev/null && echo "proxy.golang.org OK"
    - getent hosts gitlab.com

# ── languages ─────────────────────────────────────────────────────────────────

lang:python:
  extends: .msb
  stage: languages
  script:
    - apk add -q python3 py3-pip
    - python3 --version
    - pip3 install --quiet requests httpx 2>&1 | tail -1
    - python3 -c "import requests,httpx; print('requests:',requests.__version__,'httpx:',httpx.__version__)"
    - python3 -c "print('CPU sum(i^2,1M):', sum(i*i for i in range(1_000_000)))"

lang:node:
  extends: .msb
  stage: languages
  script:
    - apk add -q nodejs npm
    - node --version && npm --version
    - mkdir /tmp/nodetest && cd /tmp/nodetest
    - npm init -y > /dev/null
    - npm install --save lodash axios 2>&1 | tail -3
    - node -e "const _=require('lodash'); console.log('sum 1-10:',_.sum(_.range(1,11))); console.log('axios:',require('axios').VERSION);"

lang:go:
  extends: .msb
  stage: languages
  script:
    - apk add -q go python3
    - go version
    - mkdir /tmp/gotest && cd /tmp/gotest
    - go mod init testmod
    - python3 -c "
src='''package main
import (\"fmt\";\"math/big\";\"runtime\";\"time\")
func fib(n int) *big.Int {
  a,b:=big.NewInt(0),big.NewInt(1)
  for i:=0;i<n;i++{a,b=b,new(big.Int).Add(a,b)}
  return a
}
func main(){
  s:=time.Now()
  fmt.Printf(\"Go %s on %s/%s\\n\",runtime.Version(),runtime.GOOS,runtime.GOARCH)
  fmt.Printf(\"fib(100)=%s\\n\",fib(100))
  fmt.Printf(\"took: %s\\n\",time.Since(s))
}'''
open('main.go','w').write(src)"
    - go run main.go

lang:ruby:
  extends: .msb
  stage: languages
  script:
    - apk add -q ruby
    - ruby --version
    - ruby -e "require 'digest'; p=(2..50).select{|n|(2...n).none?{|d|n%d==0}}; puts p.inspect; puts Digest::SHA256.hexdigest(p.to_s)"

lang:rust:
  extends: .msb
  stage: languages
  script:
    - apk add -q rust cargo python3
    - rustc --version && cargo --version
    - mkdir /tmp/rusttest && cd /tmp/rusttest
    - cargo init --name hello 2>&1 | tail -1
    - python3 -c "
open('src/main.rs','w').write('''
fn is_prime(n:u64)->bool{if n<2{return false;}(2..=((n as f64).sqrt() as u64)).all(|i|n%i!=0)}
fn main(){
  let p:Vec<u64>=(2..100).filter(|&n|is_prime(n)).collect();
  println!(\"Primes<100 ({} found): {:?}\",p.len(),p);
}''')"
    - cargo build --release 2>&1 | tail -3
    - ./target/release/hello

# ── build-tools ───────────────────────────────────────────────────────────────

build:make-c:
  extends: .msb
  stage: build-tools
  script:
    - apk add -q build-base python3
    - mkdir /tmp/ctest && cd /tmp/ctest
    - python3 -c "
open('main.c','w').write(r'''
#include <stdio.h>
#include <stdlib.h>
#include <string.h>
int main(){
  printf(\"Hello from C on microVM!\n\");
  char *buf=malloc(64*1024*1024);
  if(!buf){fprintf(stderr,\"malloc failed\n\");return 1;}
  memset(buf,0x42,64*1024*1024);
  printf(\"Allocated and filled 64MB OK\n\");
  free(buf);return 0;
}'''.lstrip())"
    - gcc -O2 -o main main.c
    - ./main

build:npm-jest:
  extends: .msb
  stage: build-tools
  script:
    - apk add -q nodejs npm python3
    - mkdir /tmp/npmproj && cd /tmp/npmproj
    - npm init -y > /dev/null
    - npm install --save-dev jest 2>&1 | tail -3
    - python3 -c "
import json
open('sum.js','w').write('function sum(a,b){return a+b;}\nfunction factorial(n){return n<=1?1:n*factorial(n-1);}\nmodule.exports={sum,factorial};')
open('sum.test.js','w').write(\"const {sum,factorial}=require('./sum');\ntest('sum',()=>expect(sum(1,2)).toBe(3));\ntest('neg',()=>expect(sum(-1,1)).toBe(0));\ntest('f5',()=>expect(factorial(5)).toBe(120));\ntest('f10',()=>expect(factorial(10)).toBe(3628800));\n\")
p=json.load(open('package.json')); p['scripts']={'test':'jest'}; json.dump(p,open('package.json','w'),indent=2)"
    - npx jest --no-coverage 2>&1 | tail -10

build:python-pytest:
  extends: .msb
  stage: build-tools
  script:
    - apk add -q python3 py3-pip
    - pip install --quiet pytest flask pydantic 2>&1 | tail -1
    - python3 -c "import flask,pydantic; print('flask:',flask.__version__,'pydantic:',pydantic.__version__)"
    - mkdir /tmp/pytest && cd /tmp/pytest
    - python3 -c "
open('test_math.py','w').write('''
def test_add():    assert 1+1==2
def test_sort():   assert sorted([3,1,4,1,5,9])==[1,1,3,4,5,9]
def test_dict():   assert sum({\"a\":1,\"b\":2}.values())==3
def test_string(): assert \"microvm\".upper()==\"MICROVM\"
def test_fresh():
    import os; assert not os.path.exists(\"/tmp/pytest-was-here\"), \"state leak!\"
    open(\"/tmp/pytest-was-here\",\"w\").close()
''')"
    - python3 -m pytest test_math.py -v 2>&1 | tail -10

build:docker-absent:
  extends: .msb
  stage: build-tools
  script:
    - command -v docker && (echo "UNEXPECTED: docker present" && exit 1) || echo "docker not available (correct)"
    - apk add -q build-base cmake
    - gcc --version | head -1 && cmake --version | head -1

# ── network ───────────────────────────────────────────────────────────────────

net:git-clone:
  extends: .msb
  stage: network
  script:
    - apk add -q git
    - git clone --depth 1 https://github.com/junegunn/fzf.git /tmp/fzf 2>&1 | tail -3
    - du -sh /tmp/fzf
    - git -C /tmp/fzf log --oneline -3

net:download-large:
  extends: .msb
  stage: network
  script:
    - apk add -q curl
    - curl -sf --max-time 60 -o /tmp/gobin.tar.gz https://go.dev/dl/go1.22.0.linux-arm64.tar.gz --write-out "size=%{size_download} time=%{time_total}s speed=%{speed_download}B/s\n"
    - ls -lh /tmp/gobin.tar.gz

net:concurrent-http:
  extends: .msb
  stage: network
  script:
    - apk add -q python3
    - python3 -c "
import urllib.request,threading,time
urls=['https://api.github.com/zen','https://pypi.org/pypi/requests/json','https://registry.npmjs.org/lodash/latest','https://httpbin.org/uuid','https://httpbin.org/ip']*4
results=[]; lock=threading.Lock()
def fetch(url):
    try:
        t=time.time(); urllib.request.urlopen(url,timeout=10).read()
        with lock: results.append(('OK',f'{time.time()-t:.2f}s',url))
    except Exception as e:
        with lock: results.append(('FAIL',str(e)[:50],url))
ts=[threading.Thread(target=fetch,args=(u,)) for u in urls]; [t.start() for t in ts]; [t.join() for t in ts]
ok=sum(1 for r in results if r[0]=='OK'); print(f'{ok}/{len(results)} OK')
[print(f'  {s:4}  {i:12}  {u}') for s,i,u in sorted(results)]
"

# ── stress ────────────────────────────────────────────────────────────────────

stress:cpu:
  extends: .msb
  stage: stress
  script:
    - apk add -q python3
    - python3 -c "
import time; start=time.time(); limit=500_000
sieve=bytearray([1])*(limit+1); sieve[0]=sieve[1]=0
for i in range(2,int(limit**0.5)+1):
    if sieve[i]: sieve[i*i::i]=bytearray(len(sieve[i*i::i]))
primes=[i for i,v in enumerate(sieve) if v]
print(f'Primes up to {limit}: {len(primes)} in {time.time()-start:.3f}s, largest={primes[-1]}')
"

stress:memory:
  extends: .msb
  stage: stress
  script:
    - apk add -q python3
    - python3 -c "
total=0; chunks=[]
while total<700:
    try:
        buf=bytearray(50*1024*1024)
        for i in range(0,len(buf),4096): buf[i]=0xFF
        chunks.append(buf); total+=50; print(f'  {total}MB allocated')
    except MemoryError: print(f'  OOM at {total}MB (expected)'); break
print(f'Peak: {total}MB')
"

stress:disk:
  extends: .msb
  stage: stress
  script:
    - echo "Write 500MB"
    - dd if=/dev/zero of=/tmp/bigfile bs=1M count=500 conv=fsync 2>&1 | tail -1
    - echo "Read 500MB"
    - dd if=/tmp/bigfile of=/dev/null bs=1M 2>&1 | tail -1
    - ls -lh /tmp/bigfile && rm /tmp/bigfile
    - echo "10k small files"
    - mkdir /tmp/mf
    - time sh -c 'i=0; while [ $i -lt 10000 ]; do echo $i > /tmp/mf/$i.txt; i=$((i+1)); done'
    - ls /tmp/mf | wc -l | xargs echo "files:"
    - rm -rf /tmp/mf

stress:full-toolchain:
  extends: .msb
  stage: stress
  script:
    - echo "Install full toolchain from scratch"
    - time apk add -q nodejs npm python3 py3-pip go build-base git curl
    - node --version && python3 --version && go version && gcc --version | head -1 && git --version
    - df -h /
