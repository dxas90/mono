# #     - when: never

stages:
  - initialize
  - build
  - test
  - containerize
  - deployment
  - promote
  - notify

include:
  - local: .gitlab-ci-template.yml

detect-changes:
  stage: initialize
  image: alpine:3
  before_script:
    - apk add --no-cache curl jq bash git
    # Ensure we have full history for git diff to work
    - git fetch --unshallow 2>&1 >/dev/null || echo "Repository already unshallowed or full clone"
    - git submodule update --init --remote --merge --recursive
  script:
    - |
      echo "--- Detecting environment and version ---"

      ZERO_SHA="0000000000000000000000000000000000000000"

      # Determine VERSION from tag or branch
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Sanitize tag to be used as version
        NOSLASH=$(echo "$CI_COMMIT_TAG" | tr -s / -)
        SANITIZED="${NOSLASH//[^a-zA-Z0-9.-]/}"
        VERSION="$SANITIZED"
      else
        # Sanitize branch name for version tag
        NOSLASH=$(echo "$CI_COMMIT_REF_NAME" | tr -s / -)
        SANITIZED="${NOSLASH//[^a-zA-Z0-9-]/}"
        VERSION="branch-$SANITIZED"
      fi

      # Determine BEFORE_SHA
      if [ "$CI_COMMIT_BEFORE_SHA" = "$ZERO_SHA" ] || [ -z "$CI_COMMIT_BEFORE_SHA" ]; then
        BEFORE_SHA=$(git rev-parse "$CI_COMMIT_SHA^" 2>/dev/null || echo "")
      else
        BEFORE_SHA="$CI_COMMIT_BEFORE_SHA"
      fi

      echo "CI_COMMIT_SHA=$CI_COMMIT_SHA"
      echo "CI_COMMIT_BEFORE_SHA=$CI_COMMIT_BEFORE_SHA"
      echo "BEFORE_SHA=$BEFORE_SHA"

      # Detect changed apps (folders under apps/)
      if [ -n "$BEFORE_SHA" ]; then
        CHANGED_APPS=$(git diff --name-only "$BEFORE_SHA" "$CI_COMMIT_SHA" | grep '^apps/' | cut -d/ -f2 | sort -u || true)
      else
        CHANGED_APPS=""
      fi

      if [ -z "$CHANGED_APPS" ]; then
        echo "No changed apps detected, defaulting to all apps..."
        CHANGED_APPS=$(ls apps 2>/dev/null || echo "")
      fi

      echo -e "Detected changed apps: \n$CHANGED_APPS"
      mkdir -p .generated
      echo "include:" > .generated/child-pipeline.yml
      for app in $CHANGED_APPS; do
        case $app in
          acme-lambda-cloudflare-go)
            URL="https://raw.githubusercontent.com/dxas90/acme-lambda-cloudflare-go/main/.gitlab-ci.yml"
            ;;
          django-postgresql-gunicorn)
            URL="https://raw.githubusercontent.com/dxas90/django-postgresql-gunicorn/main/.gitlab-ci.yml"
            ;;
          learn)
            URL="https://raw.githubusercontent.com/dxas90/learn/main/.gitlab-ci.yml"
            ;;
          network-stats)
            URL="https://raw.githubusercontent.com/dxas90/network-stats/master/.gitlab-ci.yml"
            ;;
          pg-database-tester)
            URL="https://raw.githubusercontent.com/dxas90/pg-database-tester/main/.gitlab-ci.yml"
            ;;
          sinatra-mysql-puma)
            URL="https://raw.githubusercontent.com/dxas90/sinatra-mysql-puma/master/.gitlab-ci.yml"
            ;;
        esac

        curl -fsSL "$URL" -o ".generated/${app}.gitlab-ci.yml" || echo "# Missing: $app"
        echo "  - local: .generated/${app}.gitlab-ci.yml" >> .generated/child-pipeline.yml
      done
  artifacts:
    paths:
      - .generated/child-pipeline.yml
    expire_in: "30 days"

trigger-dynamic-apps:
  stage: initialize
  needs: [detect-changes]
  trigger:
    include:
      - artifact: .generated/child-pipeline.yml
        job: detect-changes
    strategy: depend
    forward:
      yaml_variables: false
      pipeline_variables: false
  variables:
    CI_COMMIT_TAG: $CI_COMMIT_TAG
    CI_COMMIT_REF_NAME: $CI_COMMIT_REF_NAME
