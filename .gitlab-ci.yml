#     # Run the pipeline for a Merge Request event targeting the main branch
#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
#       when: always
#     # Run the pipeline when a tag is created that matches the pattern /^v\d+\.\d+\.\d+.*$/
#     - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME =~ /^v\d+\.\d+\.\d+.*$/'
#       when: always
#     # Run the pipeline when pushing to any branch except main
#     - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "main"'
#       when: always
# #     # Disable the pipeline in all other cases
# #     - when: never

stages:
  - initialize
  - build
  - test
  - containerize
  - deployment
  - promote
  - notify

include:
  - local: .gitlab-ci-template.yml

detect-changes:
  stage: initialize
  image: alpine:3
  before_script:
    - apk add --no-cache curl bash git
    # Ensure we have full history for git diff to work
    - git fetch --unshallow 2>&1 >/dev/null || echo "Repository already unshallowed or full clone"
    - git submodule update --init --remote --merge --recursive
  script:
    - |
      echo "--- Detecting environment and version ---"

      ZERO_SHA="0000000000000000000000000000000000000000"

      # Determine VERSION from tag or branch
      if [ -n "$CI_COMMIT_TAG" ]; then
        NOSLASH=$(echo "$CI_COMMIT_TAG" | tr -s / -)
        SANITIZED=$(echo "$NOSLASH" | tr -cd '[:alnum:].-')
        VERSION="$SANITIZED"
      else
        NOSLASH=$(echo "$CI_COMMIT_REF_NAME" | tr -s / -)
        SANITIZED=$(echo "$NOSLASH" | tr -cd '[:alnum:]-')
        VERSION="branch-$SANITIZED"
      fi

      # Determine BEFORE_SHA
      if [ "$CI_COMMIT_BEFORE_SHA" = "$ZERO_SHA" ] || [ -z "$CI_COMMIT_BEFORE_SHA" ]; then
        BEFORE_SHA=$(git rev-parse "$CI_COMMIT_SHA^" 2>/dev/null || echo "")
      else
        BEFORE_SHA="$CI_COMMIT_BEFORE_SHA"
      fi

      echo "CI_COMMIT_SHA=$CI_COMMIT_SHA"
      echo "BEFORE_SHA=$BEFORE_SHA"

      # Detect changed apps (folders under apps/)
      if [ -n "$BEFORE_SHA" ]; then
        CHANGED_APPS=$(git diff --name-only "$BEFORE_SHA" "$CI_COMMIT_SHA" | grep '^apps/' | cut -d/ -f2 | sort -u || true)
      else
        CHANGED_APPS=""
      fi

      if [ -z "$CHANGED_APPS" ]; then
        echo "No changed apps detected, defaulting to all apps..."
        CHANGED_APPS=$(ls apps 2>/dev/null || echo "")
      fi

      echo "Detected apps: $CHANGED_APPS"

      mkdir -p .generated
      echo "include:" > .generated/child-pipeline.yml

      # Build lookup table for submodule SHAs
      echo "--- Building SHA map from git submodule status ---"
      git submodule status | while read -r sha path _; do
        app=$(basename "$path")
        echo "$app $sha"
      done > .generated/submodules.txt

      # Function to get SHA from .generated/submodules.txt
      get_sha() {
        grep -E "^$1 " .generated/submodules.txt | awk '{print $2}'
      }

      for app in $CHANGED_APPS; do
        sha=$(get_sha "$app")
        if [ -z "$sha" ]; then
          echo "⚠️ No SHA found for $app — skipping"
          continue
        fi

        case "$app" in
          acme-lambda-cloudflare-go)
            REPO="dxas90/acme-lambda-cloudflare-go" ;;
          django-postgresql-gunicorn)
            REPO="dxas90/django-postgresql-gunicorn" ;;
          learn)
            REPO="dxas90/learn" ;;
          network-stats)
            REPO="dxas90/network-stats" ;;
          pg-database-tester)
            REPO="dxas90/pg-database-tester" ;;
          sinatra-mysql-puma)
            REPO="dxas90/sinatra-mysql-puma" ;;
          *)
            echo "Unknown submodule $app — skipping"
            continue ;;
        esac

        URL="https://raw.githubusercontent.com/${REPO}/${sha}/.gitlab-ci.yml"
        TARGET=".generated/${app}.gitlab-ci.yml"

        echo "Fetching ${URL}"
        if curl -fsSL "$URL" -o "$TARGET"; then
          echo "  - artifact: $TARGET" >> .generated/child-pipeline.yml
          echo "    job: detect-changes" >> .generated/child-pipeline.yml
        else
          echo "# WARNING: Missing CI file for $app" >> .generated/child-pipeline.yml
        fi
      done

      echo "--- Generated child pipeline include file ---"
      cat .generated/child-pipeline.yml
  artifacts:
    paths:
      - .generated/*
      - apps/*
    expire_in: "30 days"

trigger-dynamic-apps:
  stage: initialize
  needs:
    - job: detect-changes
      artifacts: true
  trigger:
    include:
      - artifact: .generated/child-pipeline.yml
        job: detect-changes
    strategy: depend
    forward:
      yaml_variables: false
      pipeline_variables: false
  variables:
    CI_COMMIT_TAG: $CI_COMMIT_TAG
    CI_COMMIT_REF_NAME: $CI_COMMIT_REF_NAME
