stages:
  - verify

verify:isolation:
  stage: verify
  tags: [msb]
  script:
    - echo "=== Microsandbox fleet runner ==="
    - echo "Hostname:$(hostname)"
    - echo "Kernel:$(uname -r)"
    - echo "Arch:$(uname -m)"
    - echo "User:$(whoami)"
    - echo "=== Isolation check ==="
    - echo "PID1:$(cat /proc/1/cmdline 2>/dev/null | tr '\0' ' ' | head -c80 || echo unknown)"
    - echo "=== Done ==="

verify:ephemeral:
  stage: verify
  tags: [msb]
  script:
    - echo "Checking ephemeral isolation..."
    - ls /tmp/was-here 2>/dev/null && echo "LEAK DETECTED" || echo "clean slate OK"
    - touch /tmp/was-here
    - echo "Marked VM"
