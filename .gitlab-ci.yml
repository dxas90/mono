#     # Run the pipeline for a Merge Request event targeting the main branch
#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
#       when: always
#     # Run the pipeline when a tag is created that matches the pattern /^v\d+\.\d+\.\d+.*$/
#     - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME =~ /^v\d+\.\d+\.\d+.*$/'
#       when: always
#     # Run the pipeline when pushing to any branch except main
#     - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "main"'
#       when: always
# #     # Disable the pipeline in all other cases
# #     - when: never

stages:
  - build
  - push
  - test
  - deploy
  - release

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  EPHEMERAL_NAMESPACE: "ephemeral-${CI_COMMIT_REF_SLUG}"
  STAGING_NAMESPACE: "staging"
  PRODUCTION_NAMESPACE: "production"

# -------------------------------------------------
# FEATURE BRANCH PIPELINE
# -------------------------------------------------

build_feature:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
  script:
    - echo "🔨 Building container for feature branch $CI_COMMIT_BRANCH"
    - echo "docker build -t $IMAGE_NAME ."

push_feature:
  stage: push
  needs: [build_feature]
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
  script:
    - echo "📦 Pushing container for feature branch $CI_COMMIT_BRANCH"
    - echo "docker push $IMAGE_NAME"

test_feature:
  stage: test
  needs: [push_feature]
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
  script:
    - echo "🧪 Running tests for feature branch $CI_COMMIT_BRANCH"

deploy_feature:
  stage: deploy
  needs: [test_feature]
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
  script:
    - echo "🚀 Deploying $IMAGE_NAME to ephemeral namespace $EPHEMERAL_NAMESPACE"
    - echo "kubectl create namespace $EPHEMERAL_NAMESPACE || true"
    - echo "kubectl apply -n $EPHEMERAL_NAMESPACE -f k8s/deployment.yaml"

# -------------------------------------------------
# MAIN BRANCH (MERGED) PIPELINE
# -------------------------------------------------

build_main:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "🔨 Building container for main branch"
    - echo "docker build -t $IMAGE_NAME ."

push_main:
  stage: push
  needs: [build_main]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "📦 Pushing container for main branch"
    - echo "docker push $IMAGE_NAME"

test_main:
  stage: test
  needs: [push_main]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "🧪 Running tests for main branch"

deploy_staging:
  stage: deploy
  needs: [test_main]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "🚀 Deploying $IMAGE_NAME to staging namespace $STAGING_NAMESPACE"
    - echo "kubectl apply -n $STAGING_NAMESPACE -f k8s/deployment.yaml"

# -------------------------------------------------
# PRODUCTION DEPLOYMENT (ON TAG)
# -------------------------------------------------

deploy_production:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "🏷️ Tag detected -> $CI_COMMIT_TAG"
    - echo "🚀 Deploying image $IMAGE_NAME to production namespace $PRODUCTION_NAMESPACE"
    - echo "kubectl apply -n $PRODUCTION_NAMESPACE -f k8s/deployment.yaml"

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
