# Single system pinned to a tag. Clears all defaults.
systems:
  my-app:
    source:
      url: https://github.com/example/my-app.git
      ref:
        tag: v1.2.3
      ignore: |
        /*
        !k8s/
    helmRelease:
      targetNamespace: default
      chart: ./k8s/chart
      values:
        image:
          repository: ghcr.io/example/my-app
