# Single system deploying to the staging namespace. Clears all defaults.
systems:
  my-app:
    source:
      url: https://github.com/example/my-app.git
      ref:
        branch: main
      ignore: |
        /*
        !k8s/
    helmRelease:
      targetNamespace: staging
      chart: ./k8s/chart
      values:
        image:
          repository: ghcr.io/example/my-app
