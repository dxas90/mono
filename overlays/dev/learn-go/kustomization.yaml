---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/learn-go
patches:
  - patch: |-
      - op: replace
        path: /spec/values/image/tag
        value: "0.1.0"
    target:
      kind: HelmRelease
      name: learn-go
  - patch: |-
      - op: replace
        path: /spec/targetNamespace
        value: "learn-dev"
    target:
      kind: HelmRelease
      name: learn-go
