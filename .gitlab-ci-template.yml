# Template: Build, Test, Notify, and Deploy a containerized Python app
# Adapted from https://gitlab.com/dxas90/network-stats
.load_env: &load_env
  - touch build.env || true && source build.env
.python-test:
  image: python:3.12
  before_script:
    - *load_env
  script:
    - pip install --upgrade pip
    - pip install -r requirements.txt || true
    - pytest

.node-test:
  image: node:22-alpine
  before_script:
    - *load_env
  script:
    - apk update
    - apk add --no-cache bash git
    - corepack enable
    - corepack prepare pnpm@10.18.1 --activate
    - pnpm install --frozen-lockfile --ignore-scripts || { echo "Error -> pnpm install failed. Skipping build..."; exit 1; }
    - pnpm run build || { echo "Error -> pnpm build failed. Skipping..."; exit 1; }
    - pnpm test || { echo "Error -> pnpm test failed. Skipping..."; exit 1; }

.go-test:
  image: golang:1.25
  before_script:
    - *load_env
  script:
    - go mod download
    - go build -v ./...
    - go test -v ./...

.notify:
  image: bash
  before_script:
    - *load_env
  script:
    - echo "Notify all the people that need to know about this project using some tool like Slack/Mattermost/RocketChat/MSTeams..."

# Containerize the app using Buildah instead of Kaniko
.containerize-buildah:
  image: quay.io/buildah/stable:latest
  stage: containerize
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
    BUILDAH_ARGS: ""
    BUILD_CONTEXT: $CI_PROJECT_DIR
    REGISTRY: $CI_REGISTRY
    REGISTRY_USER: $CI_REGISTRY_USER
    REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
    IMAGE_REPOSITORY: $CI_REGISTRY_IMAGE
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 30 mins
  before_script:
    - *load_env
    # If no .npmrc is included in the repo, generate a temporary one that is configured to publish to GitLab's NPM registry
    - |
      if [[ ! -f .npmrc ]]; then
        echo 'No .npmrc found! Creating one now. Please review the following link for more information: https://docs.gitlab.com/user/packages/npm_registry/?tab=For+an+instance#authenticate-to-the-package-registry'
        {
          echo "@${CI_PROJECT_ROOT_NAMESPACE}:registry=${CI_API_V4_URL}/packages/npm/"
          echo "${CI_API_V4_URL#http*:}/packages/npm/:_authToken=${NPM_TOKEN}"
        } >> .npmrc
      fi
    - touch build.env
    - echo "nameserver 1.1.1.1" > /etc/resolv.conf
    - dnf install curl -y
  script:
    # Locate Dockerfile / Containerfile
    - |
      if [ -z "$DOCKERFILE_PATH" ]; then
        if [ -f "$BUILD_CONTEXT/Dockerfile" ]; then
          DOCKERFILE_PATH="$BUILD_CONTEXT/Dockerfile"
        elif [ -n "$CONTAINERFILE_PATH" ]; then
          DOCKERFILE_PATH="$CONTAINERFILE_PATH"
        elif [ -f "$BUILD_CONTEXT/Containerfile" ]; then
          DOCKERFILE_PATH="$BUILD_CONTEXT/Containerfile"
        else
          echo "ERROR -> No Dockerfile or Containerfile found in build context"
          exit 1
        fi
      fi
    - echo "Using Dockerfile -> $DOCKERFILE_PATH"

    # Determine image tag
    - |
      if [ -z "${IMAGE_TAG+x}" ]; then
        if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
          VERSION="latest"
        elif [ -n "$CI_COMMIT_TAG" ]; then
          NOSLASH=$(echo "$CI_COMMIT_TAG" | tr -s / -)
          SANITIZED="${NOSLASH//[^a-zA-Z0-9.-]/}"
          VERSION="$SANITIZED"
        else
          NOSLASH=$(echo "$CI_COMMIT_REF_NAME" | tr -s / -)
          SANITIZED="${NOSLASH//[^a-zA-Z0-9-]/}"
          VERSION="branch-$SANITIZED"
        fi
        export IMAGE_TAG="$IMAGE_REPOSITORY:$VERSION"
      fi
    - echo "IMAGE_TAG=$IMAGE_TAG" >> build.env
    - echo "Building image -> $IMAGE_TAG"
    - |
      if [ "$BUILDAH_ISOLATION" = "rootless" ]; then
        export BUILDAH_ISOLATION=rootless
        export STORAGE_DRIVER=vfs
      fi
    # Buildah login
    - buildah login -u "$REGISTRY_USER" --password "$REGISTRY_PASSWORD" "$REGISTRY"

    # Single-line build and push
    - |
      buildah bud \
        --isolation="$BUILDAH_ISOLATION" \
        --storage-driver="$STORAGE_DRIVER" \
        --format="$BUILDAH_FORMAT" \
        --tls-verify=false \
        -f "$DOCKERFILE_PATH" \
        -t "$IMAGE_TAG" $BUILDAH_ARGS \
        "$BUILD_CONTEXT"
    - |
      if [ -z "$NO_PUSH" ]; then
        echo "Pushing image to registry..."
        buildah push "$IMAGE_TAG"
      else
        echo "Skipping push (NO_PUSH defined)"
      fi
  rules:
    - exists:
        - Dockerfile
        - Containerfile
    - if: $DOCKERFILE_PATH
    - if: $CONTAINERFILE_PATH
    - if: $BUILD_CONTEXT != $CI_PROJECT_DIR

.containerize-buildx:
  image: docker:29-cli
  stage: containerize

  services:
    - name: docker:29-dind
      alias: docker

  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

    BUILD_CONTEXT: "$CI_PROJECT_DIR"
    DOCKER_PLATFORMS: "linux/amd64,linux/arm64"

    CACHE_IMAGE: "$CI_REGISTRY_IMAGE:cache"
    CACHE_FROM: "true"
    CACHE_TO: "true"

    BUILDX_SECRETS: ""
    BUILDX_BUILD_ARGS: ""

  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day

  before_script:
    - |
      set -eu

      echo "$CI_REGISTRY_PASSWORD" |
        docker login "$CI_REGISTRY" \
          --username "$CI_REGISTRY_USER" \
          --password-stdin

      docker buildx create \
        --name "builder-$CI_JOB_ID" \
        --driver docker-container \
        --use

      docker buildx inspect --bootstrap

  script:
    - |
      set -eu

      # Load existing build environment
      if [ -f build.env ]; then
        set -a
        . ./build.env
        set +a
      fi

      # Locate Dockerfile / Containerfile
      if [ -z "${DOCKERFILE_PATH:-}" ]; then
        if [ -f "$BUILD_CONTEXT/Dockerfile" ]; then
          DOCKERFILE_PATH="$BUILD_CONTEXT/Dockerfile"
        elif [ -n "${CONTAINERFILE_PATH:-}" ]; then
          DOCKERFILE_PATH="$CONTAINERFILE_PATH"
        elif [ -f "$BUILD_CONTEXT/Containerfile" ]; then
          DOCKERFILE_PATH="$BUILD_CONTEXT/Containerfile"
        else
          echo "ERROR: No Dockerfile or Containerfile found"
          exit 1
        fi
      fi

      if [ ! -f "$DOCKERFILE_PATH" ]; then
        echo "ERROR: Dockerfile not found: $DOCKERFILE_PATH"
        exit 1
      fi

      # Determine image tag
      if [ -z "${IMAGE_TAG:-}" ]; then
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          VERSION="$CI_COMMIT_REF_SLUG"
        elif [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
          VERSION="latest"
        else
          VERSION="branch-$CI_COMMIT_REF_SLUG"
        fi

        IMAGE_TAG="$CI_REGISTRY_IMAGE:$VERSION"
      fi

      COMMIT_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

      # Prepare dotenv artifact
      printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > build.env
      printf 'COMMIT_IMAGE=%s\n' "$COMMIT_IMAGE" >> build.env

      echo "Building: $IMAGE_TAG"
      echo "Platforms: $DOCKER_PLATFORMS"
      echo "Dockerfile: $DOCKERFILE_PATH"

      # Assemble Buildx arguments safely
      set --

      # Generic BuildKit secrets
      if [ -n "${BUILDX_SECRETS:-}" ]; then
        while IFS= read -r secret || [ -n "$secret" ]; do
          case "$secret" in
            ""|\#*) continue ;;
          esac
          set -- "$@" --secret "$secret"
        done <<EOF
      $BUILDX_SECRETS
      EOF
      fi

      # Generic Docker build arguments
      if [ -n "${BUILDX_BUILD_ARGS:-}" ]; then
        while IFS= read -r arg || [ -n "$arg" ]; do
          case "$arg" in
            ""|\#*) continue ;;
          esac
          set -- "$@" --build-arg "$arg"
        done <<EOF
      $BUILDX_BUILD_ARGS
      EOF
      fi

      # Registry cache
      if [ "${CACHE_FROM:-true}" = "true" ]; then
        set -- "$@" \
          --cache-from "type=registry,ref=$CACHE_IMAGE"
      fi

      if [ "${CACHE_TO:-true}" = "true" ] &&
         [ -z "${NO_PUSH:-}" ]; then
        set -- "$@" \
          --cache-to "type=registry,ref=$CACHE_IMAGE,mode=max"
      fi

      # Build configuration
      set -- "$@" \
        --file "$DOCKERFILE_PATH" \
        --platform "$DOCKER_PLATFORMS" \
        --tag "$IMAGE_TAG" \
        --tag "$COMMIT_IMAGE"

      if [ -z "${NO_PUSH:-}" ]; then
        echo "Building and pushing images..."

        docker buildx build \
          "$@" \
          --push \
          "$BUILD_CONTEXT"
      else
        echo "NO_PUSH defined: validating build without push"

        docker buildx build \
          "$@" \
          --output type=cacheonly \
          "$BUILD_CONTEXT"
      fi

  after_script:
    - docker buildx rm "builder-$CI_JOB_ID" || true

  rules:
    - exists:
        - Dockerfile
        - Containerfile
    - if: '$DOCKERFILE_PATH'
    - if: '$CONTAINERFILE_PATH'
    - if: '$BUILD_CONTEXT != $CI_PROJECT_DIR'

.image-promote-buildah:
  image: quay.io/buildah/stable:latest
  stage: promote
  variables:
    REGISTRY: $CI_REGISTRY
    REGISTRY_USER: $CI_REGISTRY_USER
    REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
    IMAGE_REPOSITORY: $CI_REGISTRY_IMAGE
    SOURCE_TAG: $IMAGE_TAG
    TARGET_TAG: $PROMOTE_TAG
  script:
    - |
      if [ -z "$SOURCE_TAG" ]; then
        echo "ERROR: SOURCE_TAG (built image) is not set."
        exit 1
      fi
      if [ -z "$TARGET_TAG" ]; then
        echo "ERROR: TARGET_TAG (promotion tag) is not set."
        exit 1
      fi
      buildah login -u "$REGISTRY_USER" --password "$REGISTRY_PASSWORD" "$REGISTRY"
      echo "Promoting image $SOURCE_TAG to $IMAGE_REPOSITORY:$TARGET_TAG"
      buildah pull "$SOURCE_TAG"
      buildah tag "$SOURCE_TAG" "$IMAGE_REPOSITORY:$TARGET_TAG"
    - touch buildah-promotion.env
    - echo "PROMOTED_IMAGE=$IMAGE_REPOSITORY:$TARGET_TAG" >> buildah-promotion.env
    - |
      if [ -z "$NO_PUSH" ]; then
        echo "Pushing promoted image to registry..."
        buildah push "$IMAGE_REPOSITORY:$TARGET_TAG"
      else
        echo "Skipping push (NO_PUSH defined)"
      fi
  artifacts:
    reports:
      dotenv: buildah-promotion.env
  rules:
    - if: '$PROMOTE_TAG'

.image-promote-buildx:
  image: docker:cli
  stage: promote

  variables:
    REGISTRY: "$CI_REGISTRY"
    REGISTRY_USER: "$CI_REGISTRY_USER"
    REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    IMAGE_REPOSITORY: "$CI_REGISTRY_IMAGE"
    SOURCE_TAG: "$IMAGE_TAG"
    TARGET_TAG: "$PROMOTE_TAG"

  script:
    - |
      set -eu

      if [ -z "${SOURCE_TAG:-}" ]; then
        echo "ERROR: SOURCE_TAG (built image) is not set."
        exit 1
      fi

      if [ -z "${TARGET_TAG:-}" ]; then
        echo "ERROR: TARGET_TAG (promotion tag) is not set."
        exit 1
      fi

      echo "$REGISTRY_PASSWORD" |
        docker login "$REGISTRY" \
          --username "$REGISTRY_USER" \
          --password-stdin

      # Accept either a full source reference or a simple tag
      case "$SOURCE_TAG" in
        */*:*|*@sha256:*)
          SOURCE_IMAGE="$SOURCE_TAG"
          ;;
        *)
          SOURCE_IMAGE="$IMAGE_REPOSITORY:$SOURCE_TAG"
          ;;
      esac

      PROMOTED_IMAGE="$IMAGE_REPOSITORY:$TARGET_TAG"

      echo "Promoting $SOURCE_IMAGE to $PROMOTED_IMAGE"

      if [ -z "${NO_PUSH:-}" ]; then
        docker buildx imagetools create \
          --tag "$PROMOTED_IMAGE" \
          "$SOURCE_IMAGE"

        echo "PROMOTED_IMAGE=$PROMOTED_IMAGE" \
          > promotion.env

        docker buildx imagetools inspect \
          "$PROMOTED_IMAGE"
      else
        echo "Skipping promotion (NO_PUSH defined)"
      fi

  artifacts:
    reports:
      dotenv: promotion.env

  rules:
    - if: '$PROMOTE_TAG'

.deploy:
  image:
    name: bash
  before_script:
    - *load_env
  script:
    - echo "Deploying using to Staging..."
