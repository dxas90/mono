---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: learn-mesh
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/dxas90/mesh.git
  ref:
    branch: main
  ignore: |
    # exclude
    /*
    # include
    !k8s/
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: learn-mesh
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: default
  chart:
    spec:
      chart: ./k8s/chart
      sourceRef:
        kind: GitRepository
        name: learn-mesh
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: "ghcr.io/dxas90/mesh"
    fullnameOverride: "learn-mesh"
    extraEnv:
      LEARN_GO_SERVICE_URL: "http://learn-go:8080"
      LEARN_PYTHON_SERVICE_URL: "http://learn-python:8000"
      LEARN_RUST_SERVICE_URL: "http://learn-rust:8080"
